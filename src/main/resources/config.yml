# Balatro 插件配置
# 缺失的键会在启动时自动补齐默认值（热补齐），无需手动维护完整结构。
# 改动本文件后需重启服务器生效（当前无 /reload 热载）。

reward:
  economy:
    # 过关奖励经 EconomyService 发放到服务器经济（需装 Vault + 经济插件才有实际到账；
    # 未装时本开关无副作用）。设为 false 则整体停用（回落空操作）。
    enabled: true
    # 通过一个盲注（小/大/Boss）发放的金额；0 = 关闭该档。
    blind: 1
    # 通过一个底注（击败其 Boss）发放的金额。
    ante: 10
    # 通关一局（ante 8）发放的金额；失败不发。
    win: 100
